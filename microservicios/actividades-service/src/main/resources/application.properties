spring.application.name=actividades-service
server.port=8080

# Base de datos H2 guardada en un archivo (carpeta ./data): los datos NO se pierden al reiniciar.
spring.datasource.url=jdbc:h2:file:./data/actividadesdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# JPA crea/actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Consola web para ver las tablas: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/actividadesdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
