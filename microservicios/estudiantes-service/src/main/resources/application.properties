spring.application.name=estudiantes-service
# Puerto distinto al de actividades-service (8080)
server.port=8081

# Base de datos H2 guardada en un archivo (carpeta ./data): los datos NO se pierden al reiniciar.
spring.datasource.url=jdbc:h2:file:./data/estudiantesdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Consola web: http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:file:./data/estudiantesdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
